    <!-- Suprimir erros esperados de desconexão de WebSocket/HMR em ambiente de proxy/nuvem -->
    <script>
      (function() {
        function isViteWsError(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.includes('websocket') || s.includes('closed without opened') || s.includes('@vite/client') || s.includes('[vite]');
        }

        var origError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (isViteWsError(first)) {
            return;
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (isViteWsError(msg)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
          if (isViteWsError(reason)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
